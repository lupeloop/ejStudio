# RomRaider dashboard gauge order - on-screen reading order (top-left -> bottom-right).
# One parameter name per line. # or ; = comment. Blank lines ignored.
# Match is case-insensitive and by substring, so partial names work.
# Anything not listed is appended after these, in registration order.
#
# 4 gauges per row. Mirror crops the top-right 3x3 (drops row 4 and column 1).
#
# --- Row 1 ---
Engine Speed
Coolant Temperature
A/F Correction #1
AEM UEGO Wideband
# --- Row 2 ---
Engine Load
Intake Air Temperature
A/F Learning #1
Final Fueling Base
# --- Row 3 ---
CL/OL Fueling
IAM
Fine Learning Knock Correction
Feedback Knock Correction
# --- Row 4 ---
Mass Airflow Sensor Voltage
Knock Correction Advance
Closed Loop Fueling Target
Vehicle Speed
