# RomRaider OLED gauge - display look & motion. Lines with # or ; are ignored.
#
# --- Typeface ---------------------------------------------------------
# font.file : path to a .ttf/.otf to use for ALL gauge text. Blank = keep
#             the theme font. Use a face with TABULAR (fixed-width) figures
#             or the digits will shimmy sideways as values change.
# font.bold : true synthesises bold; set false if your face is already a
#             display weight and the faux-bold looks heavy.
font.file =
font.bold = true
#
# --- Eased number motion ---------------------------------------------
# ease.tau.ms : settle time-constant for the big value. ~55 gives a ~130ms
#               settle. 0 disables (snap). Values in a warn tier ALWAYS
#               snap regardless, so knock is never lagged.
ease.tau.ms = 55
#
# --- Boot sweep -------------------------------------------------------
# boot.enabled    : roll each tile 0 -> live value once, on first data.
# boot.ms         : per-tile sweep duration.
# boot.cascade.ms : stagger between tiles, in DashOrder rank order.
boot.enabled = true
boot.ms = 2400
boot.cascade.ms = 300
#
# --- Value-driven colour ---------------------------------------------
# color.ramp : blend the digit colour neutral -> amber as a value nears
#              its approach threshold (from warnlimits.properties). The
#              amber/red tier border still escalates on top.
color.ramp = true

# --- Fuelling deviation warn ------------------------------------------
# The wideband tile warns on (actual lambda - commanded FFB lambda), not
# on raw lambda. Tiers live in warnlimits.properties as 'Lambda Deviation'.
# lambda.dev.minload : only judge at/above this engine load (g/rev).
# Below it the comparison is meaningless (idle, cruise, decel fuel cut).
lambda.dev.minload = 1.0
font.numbers = HunDIN1451.ttf
font.titles = SpaceMono-Regular.ttf

# --- defaults added by self-heal (options introduced in a newer build) ---
boot.scale.from = 0.90
boot.spread = 0.03
warn.glow = true
warn.fade.ms = 180
text.lcd = true

# --- defaults added by self-heal (options introduced in a newer build) ---
wb.cut.afr = 24.0
