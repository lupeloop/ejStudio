# Auto-record timing. # or ; = comment.
# auto.arm.ms : settle time after data/boot before auto-record begins.
auto.arm.ms = 3000
#
# cold.gate : on a cold start the secondary-air pump (SAI) skews AFR/fuel; hold
#             auto-record until that window is over so it can't pollute the log.
cold.gate = true
# cold.until.c : coolant (C) at/above which SAI is assumed done -> allow recording.
cold.until.c = 60
# cold.max.ms : hard cap from first data; record after this even if still cold.
cold.max.ms = 75000
# cold.unknown.ms : cap used when the coolant role can't be read (temp unknown).
cold.unknown.ms = 45000
