# Warm-up indicator - passive top OLED caption + a perimeter progress ring,
# shown while the engine is cold. Both appear once ECU data is live and the
# boot sweep has finished, track coolant while it climbs, then fade out ONCE
# when warm and stay gone for the rest of the session. # or ; = comment.
#
enabled = true
# threshold.c : ready (green, full loop) when Coolant reaches this (deg C).
threshold.c = 80
# coldstart.c : ring empty (red) at/below this coolant temp (deg C). The
#               fill fraction ramps linearly from coldstart.c up to threshold.c.
coldstart.c = 20
# fade.ms : fade-out duration the moment coolant reaches the threshold.
fade.ms = 500
# text : the caption shown in the pill.
text = WARMING UP
# The pill renders in the coolant gauge's MIN/MAX slot (fixed position);
# MIN/MAX returns there once the coolant reaches temperature.
#
# --- Perimeter progress ring -----------------------------------------
# ring.enabled : trace a thin loop around the whole screen edge, starting
#                TOP-LEFT and filling CLOCKWISE as coolant warms.
# ring.px      : ring thickness in pixels (2..20).
# ring.track   : draw a faint line for the un-filled remainder of the loop.
ring.enabled = true
ring.px = 5
ring.track = true
#
# --- Gradient stops (hex) shared by the caption text and the ring:
#     cold -> mid -> ready, as the fill fraction goes 0.0 -> 0.5 -> 1.0.
grad.cold = #EB2D2D
grad.mid = #E4AA28
grad.ready = #32C85A

# --- defaults added by self-heal (options introduced in a newer build) ---
eta.enabled = true
