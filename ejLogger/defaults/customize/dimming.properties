# Night dimming - offline sunrise/sunset (computed, no network).
# Blank lat/lon uses the PC's time zone. Set a city in Config > Display.
city =
lat =
lon =
# mode: auto (follow sun) | day (force bright) | night (force dim)
mode = auto

# --- defaults added by self-heal (options introduced in a newer build) ---
sunrise.offset.min = 15
sunset.offset.min = 15

# --- defaults added by self-heal (options introduced in a newer build) ---
brightness = 42
