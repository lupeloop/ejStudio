# Total Trim overlay - AFC + AFL = total fuel trim. # or ; = comment.
# Auto-engages over the AFC and AFL tiles when both are present.
# Applies live on portal reload.
#
enabled = true
#
# Total trim is only meaningful in CLOSED loop. clol.closed is the value
# your CL/OL Status param reports when CLOSED (this car: 8; open: 10).
# When it's anything else, the readout greys out.
clol.closed = 8
grey.when.open = false

# --- defaults added by self-heal (options introduced in a newer build) ---
component.scale = 1.6

# --- defaults added by self-heal (options introduced in a newer build) ---
clol.label = true

# --- defaults added by self-heal (options introduced in a newer build) ---
title = TRIMS
clol.x = 86
clol.y = 7
