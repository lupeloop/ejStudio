# Ambient flow-field screensaver for the 3x3 cluster. Self-driven motion +
# spectrum-drift colour, with live RPM adding a soft-clipped 'breath'. # or ; = comment.
#
enabled = true
# idle.minutes : stationary this long -> auto-engage.
idle.minutes = 5
# boot.engage : also engage right after the boot sweep settles.
boot.engage = false
# dismiss.speed : km/h that counts as rolling out (starts the takeoff hold).
dismiss.speed = 5
# takeoff.hold.ms : keep reacting to the climbing revs this long after rollout,
#                   THEN dissipate. Silenced when engaged manually.
takeoff.hold.ms = 15000
#
# --- field / look ---
particles = 800
# trail : 0..1 point-trail persistence (higher = longer ghost behind each point).
trail = 0.60
# dot.px : particle dot diameter in pixels (the point-cloud look).
dot.px = 3
# flow.scale : field spatial zoom (smaller = broader swirls).
flow.scale = 0.005
# flow.speed : base rate the field re-organises (per second; gate ramps it up).
flow.speed = 0.12
# flow.turns : angle range of the field (lower = smoother, more shaped streams).
flow.turns = 1.3
# hue.speed : spectrum drift rate (hue per second). hue.spread : colour variety.
hue.speed = 0.04
hue.spread = 0.50
sat = 0.70
#
# --- RPM breath (soft-clipped; calibrated to a ~656 rpm idle) ---
# response = tanh(breathe.gain * |rpm - baseline| / breathe.ref); the tanh is the
# soft-clip, so a hard drive-off surges but cannot blow out. breathe scales it 0..1.
breathe = 0.85
breathe.gain = 1.90
breathe.ref = 180
breathe.window.ms = 1800
# disperse : 0..1 outward burst that scatters the cloud when RPM stabs up.
disperse = 0.70
# gate.delta : rpm ABOVE the rolling idle baseline before reactivity opens. This is
#              idle-agnostic - cold ~2k idle and warm ~800 idle both stay calm.
gate.delta = 300
# gate.width : rpm span above gate.delta over which reactivity ramps fully in.
gate.width = 450
#
# --- Wideband -> motion character ------------------------------------
# Rich (below stoich) makes the field swell, slow and turbulent; lean tightens
# and quickens it. wideband.stoich is 1.0 for lambda, ~14.7 if it logs AFR.
wideband.motion = 0.60
wideband.stoich = 1.00
wideband.ref = 0.20
#
# --- Engine load -> density ------------------------------------------
# More load thickens the point cloud. load.idle is the idle-load floor (min
# density); load.ref is the g/rev at which it maxes. load.density scales it 0..1.
load.density = 0.70
load.idle = 0.90
load.ref = 2.20
#
# --- Coming-alive bloom ----------------------------------------------
# On engage the field wakes up (brighter, denser, more active) then settles
# over alive.ms. alive.gain scales the effect 0..1 (0 = no bloom).
alive.ms = 22000
alive.gain = 0.80
#
# --- envelope ---
fadein.ms = 1200
dissipate.ms = 1600
# night.dim : brightness multiplier when Night says it's night (0..1).
night.dim = 0.50

# --- defaults added by self-heal (options introduced in a newer build) ---
mood.enabled = true
mood.crossfade.ms = 800
mood.coldstart = true
mood.coldstart.gain = 1.0
mood.warming = true
mood.warming.gain = 1.0
mood.spirited = true
mood.spirited.gain = 1.0
mood.coasting = true
mood.coasting.gain = 1.0
mood.knock = true
mood.knock.gain = 1.0
mood.cold.c = 45
mood.ready.c = 78
mood.lean.lambda = 1.10
mood.knock.deg = 2.0

# --- defaults added by self-heal (options introduced in a newer build) ---
clock.enabled = true
clock.alpha = 0.22

# --- defaults added by self-heal (options introduced in a newer build) ---
idle.rpm.max = 1800
ratio.x = 3
ratio.y = 2
morph = 0.35
spin = 1.6
drift = 0.22
react = 1.0
react.window.ms = 10000
size = 0.40
loop.open = 0.35
line.px = 2.4
glow = 0.55
cold.c = 40
warm.c = 65
normal.c = 80
hot.c = 104
clock.size = 0.16
clock.position = corner
