# RomRaider gauge warn limits - 3-tier escalation.
# One parameter per line.  Lines starting with # or ; are ignored.
#
#   Parameter Name = approach, warn, critical
#
# Three numbers in escalation order. Direction is inferred:
#   critical > approach -> HIGHER is worse (temps, duty, load...)
#   critical < approach -> LOWER  is worse (knock corrections...)
# Tier drives the gauge face: 1 approach (amber, slow flash),
# 2 warn (red, medium flash), 3 critical (red, fast flash).
# Name match is case-insensitive and by substring.
#
Feedback Knock Correction = -1.00, -2.00, -3.00, -3.50
Fine Learning Knock Correction = -1.00, -1.40, -2.00, -2.40
Coolant Temperature = 100, 105, 108, 110
# IAM: immediate CRITICAL the instant it drops below 1.0 (three equal numbers = no amber/warn stage).
IAM = 0.999, 0.999, 0.999, 0.8750
# KCA (Knock Correction Advance): lower (more negative) is worse.
Knock Correction Advance = , ,
# Lambda Deviation: wideband MINUS commanded FFB; positive = leaner than asked = worse.
Lambda Deviation = 0.05, 0.10, 0.15, 0.25

# --- defaults added by self-heal (options introduced in a newer build) ---
hysteresis.frac = 0.05
